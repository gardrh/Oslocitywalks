<!-- PAGE -->
<div class="page-wrap">
  <div class="skyline-wrap sm">
    <img src="osloskyline.png" alt="Oslo skyline silhouette" />
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-meta">
      <span class="chapter-pill" id="chapterLabel">Chapter 1</span>
      <span class="scene-count" id="progressLabel">1 of 5</span>
    </div>
  </div>

  <div class="game-content">

    <div class="scene-card" id="sceneCard"></div>

    <!-- Feedback sits above the input -->
    <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true">
      <span class="fb-icon" id="fbIcon"></span>
      <span id="fbText"></span>
    </div>

    <input
      class="answer-input"
      id="answerInput"
      placeholder="Type your answer here…"
      aria-label="Your answer"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    />

    <div class="btn-row">
      <button class="btn btn-answer" id="answerBtn" aria-label="Submit your answer">Answer</button>
      <button class="btn btn-hint" id="hintBtn" aria-label="Get a hint">💡 Hint</button>
    </div>
  </div>
</div>
