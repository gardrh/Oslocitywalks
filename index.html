<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los! – Tour</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <button class="hamburger" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="menuPanel">
    <span></span><span></span><span></span>
  </button>
  <div class="logo">Los!</div>
  <div id="langSwitcher"></div>
</header>

<!-- SLIDE MENU -->
<div class="menu-overlay" id="menuOverlay"></div>
<nav class="menu-panel" id="menuPanel" aria-label="Main navigation" aria-hidden="true">
  <div class="menu-head">
    <button class="menu-close" id="menuClose" aria-label="Close navigation menu">✕</button>
    <div class="menu-logo">Los!</div>
    <div class="menu-tagline" id="menuTagline">Walking tours · Oslo</div>
  </div>
  <div class="menu-nav">
    <a class="menu-item" id="navHome" href="index.html">⌂  Home</a>
    <a class="menu-item" id="menuContinueLink" href="game.html">↗&nbsp;&nbsp;Continue Tour</a>
    <a class="menu-item" id="navAbout" href="about.html">i  About</a>
    <a class="menu-item" id="navPrivacy" href="privacy.html">⚖  Privacy Policy</a>
  </div>
</nav>

<!-- PAGE -->
<div class="page-wrap">
  <div class="skyline-wrap sm">
    <img src="osloskyline.png" alt="Oslo skyline silhouette" />
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-meta">
      <span class="chapter-pill" id="chapterLabel">Chapter 1</span>
      <span class="scene-count" id="progressLabel">1 of 5</span>
    </div>
  </div>

  <div class="game-content">

    <div class="scene-card" id="sceneCard"></div>

    <!-- Feedback sits above the input -->
    <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true">
      <span class="fb-icon" id="fbIcon"></span>
      <span id="fbText"></span>
    </div>

    <input
      class="answer-input"
      id="answerInput"
      placeholder="Type your answer here…"
      aria-label="Your answer"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    />

    <div class="btn-row">
      <button class="btn btn-answer" id="answerBtn" aria-label="Submit your answer">Answer</button>
      <button class="btn btn-hint" id="hintBtn" aria-label="Get a hint">💡 Hint</button>
    </div>
  </div>
</div>

<script src="translations.js"></script>
<script src="game.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initMenu();
    buildLangSwitcher();
    initGame();
    initConsent();
  });
</script>
</body>
</html>
